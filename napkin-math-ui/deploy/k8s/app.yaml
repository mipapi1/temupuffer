apiVersion: v1
kind: Namespace
metadata:
  name: napkin-math
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: napkin-math
  labels: { app: napkin-math }
spec:
  replicas: 2
  selector:
    matchLabels: { app: napkin-math }
  template:
    metadata:
      labels: { app: napkin-math }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: napkin-math-ui   # replaced by kustomize (deploy.sh pins it by digest)
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: napkin-math }
---
apiVersion: v1
kind: Service
metadata:
  name: napkin-math
spec:
  selector: { app: napkin-math }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: napkin-math
spec:
  ingressClassName: traefik
  rules:
    - host: napkinmath.agathla.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: napkin-math
                port: { name: http }
