apiVersion: apps/v1
kind: Deployment
metadata:
  name: temupuffer-console
  labels: {app.kubernetes.io/name: temupuffer-console, app.kubernetes.io/part-of: temupuffer}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: temupuffer-console}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temupuffer-console, app.kubernetes.io/part-of: temupuffer}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: console
          image: temupuffer-console
          ports:
            - {name: http, containerPort: 8080}
          env:
            # Namespace affinity: one entry per query pod (StatefulSet names), joined
            # with '+'. Keep in step with the StatefulSet's replicas. Short names get
            # this pod's namespace appended (db/ui/backends.sh).
            - name: QUERY_RING
              value: temupuffer-query-0.temupuffer-query-peers:8080+temupuffer-query-1.temupuffer-query-peers:8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: temupuffer-console
  labels: {app.kubernetes.io/name: temupuffer-console, app.kubernetes.io/part-of: temupuffer}
spec:
  selector: {app.kubernetes.io/name: temupuffer-console}
  ports:
    - {name: http, port: 80, targetPort: http}
