# Embeds search queries (all-MiniLM-L6-v2, 384 dims, CPU). The model is baked into the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-embedder
  labels: {app.kubernetes.io/name: search-embedder, app.kubernetes.io/part-of: temupuffer-search}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: search-embedder}
  template:
    metadata:
      labels: {app.kubernetes.io/name: search-embedder, app.kubernetes.io/part-of: temupuffer-search}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: embedder
          image: temupuffer-search
          command: ["uvicorn", "search.embedder_service:app", "--host", "0.0.0.0", "--port", "8091"]
          ports: [{name: http, containerPort: 8091}]
          envFrom: [{configMapRef: {name: search-config}}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: search-embedder
  labels: {app.kubernetes.io/name: search-embedder, app.kubernetes.io/part-of: temupuffer-search}
spec:
  selector: {app.kubernetes.io/name: search-embedder}
  ports: [{name: http, port: 8091, targetPort: http}]
