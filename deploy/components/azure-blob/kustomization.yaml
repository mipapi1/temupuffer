# Use Azure Blob Storage instead of S3. Add to an overlay's `components:` and do
# NOT also use bundled-s3. Removes the S3_* / AWS_* env vars from the query
# StatefulSet and the indexer Deployment, and loads credentials from Secret
# "temupuffer-azure" instead.
#
# Create the Secret first, with ONE of these (see AzureBlobStore in db/temupuffer/storage.py):
#   kubectl -n temupuffer create secret generic temupuffer-azure \
#     --from-literal=AZURE_STORAGE_CONNECTION_STRING='DefaultEndpointsProtocol=https;AccountName=<acct>;AccountKey=<key>;EndpointSuffix=core.windows.net'
#   kubectl -n temupuffer create secret generic temupuffer-azure \
#     --from-literal=AZURE_STORAGE_ACCOUNT_URL=https://<acct>.blob.core.windows.net \
#     --from-literal=AZURE_CLIENT_ID=... --from-literal=AZURE_TENANT_ID=... --from-literal=AZURE_CLIENT_SECRET=...
#     (service principal with role "Storage Blob Data Contributor" on the account)
# Container name: AZURE_STORAGE_CONTAINER (default "temupuffer"), created on startup.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: azure-env.yaml
    target: {kind: StatefulSet, name: temupuffer-query}
  - path: azure-env-indexer.yaml
    target: {kind: Deployment, name: temupuffer-indexer}
