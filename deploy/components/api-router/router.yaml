# Two replicas, so the API survives losing a router pod. They need no
# coordination: both build the same ring from the same QUERY_RING, so both send
# a namespace to the same query pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temupuffer-router
  labels: {app.kubernetes.io/name: temupuffer-router, app.kubernetes.io/part-of: temupuffer}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: temupuffer-router}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temupuffer-router, app.kubernetes.io/part-of: temupuffer}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: temupuffer-router}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: router
          image: temupuffer-console
          ports:
            - {name: http, containerPort: 8081}
          env:
            # Same list as the console's (deploy/base/console.yaml): one entry per query pod.
            - name: QUERY_RING
              value: temupuffer-query-0.temupuffer-query-peers:8080+temupuffer-query-1.temupuffer-query-peers:8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: temupuffer-router
  labels: {app.kubernetes.io/name: temupuffer-router, app.kubernetes.io/part-of: temupuffer}
spec:
  selector: {app.kubernetes.io/name: temupuffer-router}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temupuffer-router
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: temupuffer-router}
